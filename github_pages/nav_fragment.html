<style>
  .site-nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; align-items: center; }
  .site-nav a { padding: 7px 13px; border: 1px solid #ddd; border-radius: 20px;
                background: #fff; color: #1a1a1a; text-decoration: none; font-size: 13.5px; }
  .site-nav a.on { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .site-nav a.site-logo { border: none; background: none; padding: 7px 6px 7px 0;
                font-weight: 700; font-size: 15px; }
  .site-nav a.site-logo.on { background: none; color: #1a1a1a; }
  .site-nav .menu-btn { padding: 7px 13px; border: 1px solid #ddd; border-radius: 20px;
                background: #fff; color: #1a1a1a; font-size: 13.5px; cursor: pointer; }
  .site-nav .menu-btn.on { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .site-sub { display: none; margin: -6px 0 16px; }
  .site-sub.open { display: block; }
  .site-sub a { display: block; padding: 8px 10px; color: #1a1a1a; text-decoration: none;
                font-size: 13.5px; border-bottom: 1px solid #eee; }
  .site-sub a.on { font-weight: 700; }
  .site-foot { text-align: center; padding: 16px 0 6px; margin-top: 20px;
               border-top: 1px solid #eee; font-size: 12.5px; }
  .site-foot a { color: #888; text-decoration: none; }
</style>
<nav class="site-nav">
  <a class="site-logo" href="/bond-credit-monitor/" data-i18n="nav_logo">회사채 신용 스프레드 모니터</a>
  <a href="/bond-credit-monitor/" data-i18n="nav_monthly">사건별 시장 반응</a>
  <button type="button" class="menu-btn" id="siteMenuBtn" data-i18n="nav_menu">메뉴 ▾</button>
</nav>
<div class="site-sub" id="siteSub">
  <a href="/bond-credit-monitor/monitor/" data-i18n="nav_monitor">모니터</a>
  <a href="/bond-credit-monitor/trends/" data-i18n="nav_trends" style="margin-left:16px">산업별 전체 추이</a>
  <a href="/bond-credit-monitor/structure/" data-i18n="nav_structure" style="margin-left:32px">차환 리스크·등급 내 분산</a>
  <a href="/bond-credit-monitor/divergence/" data-i18n="nav_divergence" style="margin-left:48px">신용-주식 괴리</a>
</div>
<script>
(function () {
  var here = window.location.pathname.replace(/\/$/, '') || '/';
  var subHit = false;
  document.querySelectorAll('.site-sub a').forEach(function (a) {
    var p = new URL(a.getAttribute('href'), window.location.origin).pathname.replace(/\/$/, '') || '/';
    if (p === here) { a.classList.add('on'); subHit = true; }
  });
  document.querySelectorAll('.site-nav a').forEach(function (a) {
    if (a.classList.contains('site-logo')) return;
    var p = new URL(a.getAttribute('href'), window.location.origin).pathname.replace(/\/$/, '') || '/';
    if (p === here) a.classList.add('on');
  });
  var btn = document.getElementById('siteMenuBtn');
  var sub = document.getElementById('siteSub');
  if (subHit) { sub.classList.add('open'); btn.classList.add('on'); }
  btn.addEventListener('click', function () { sub.classList.toggle('open'); });
  document.addEventListener('DOMContentLoaded', function () {
    if (document.querySelector('.site-foot')) return;
    var lang = 'ko';
    try { lang = localStorage.getItem('bond-lang') || 'ko'; } catch (e) {}
    var foot = document.createElement('div');
    foot.className = 'site-foot';
    var a = document.createElement('a');
    a.href = '/bond-credit-monitor/concepts/';
    a.textContent = lang === 'en' ? 'Credit concepts guide' : '신용평가 개념 가이드';
    foot.appendChild(a);
    document.body.appendChild(foot);
  });
})();
</script>
