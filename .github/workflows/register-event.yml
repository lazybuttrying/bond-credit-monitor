name: Register event from issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: register-event
  cancel-in-progress: false

jobs:
  register:
    if: contains(github.event.issue.labels.*.name, 'event-registration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the event card
        id: build
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set +e
          python3 register_event.py --issue-body "$ISSUE_BODY" > result.json
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          {
            echo "result<<EOF"
            cat result.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cat result.json

      - name: Comment and close on rejection
        if: steps.build.outputs.rc == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          REASON=$(python3 -c "import json; print(json.load(open('result.json'))['reason_ko'])")
          gh issue comment "$ISSUE" --body "등록이 거절됐습니다. 사유: $REASON"
          gh issue close "$ISSUE"

      - name: Fail the run on setup errors
        if: steps.build.outputs.rc != '0' && steps.build.outputs.rc != '3'
        run: |
          cat result.json
          exit 1

      - name: Commit the registration and trigger publishing
        if: steps.build.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registered_events.json
          git commit -m "Register event from issue #$ISSUE"
          git push
          gh workflow run publish-registered.yml --ref main

      - name: Comment the result on the issue
        if: steps.build.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          TITLE=$(python3 -c "import json; print(json.load(open('result.json'))['title'])")
          gh issue comment "$ISSUE" --body "자동 검사를 통과했습니다: $TITLE. 사이트에 자동 등록됩니다."
          gh issue close "$ISSUE"
