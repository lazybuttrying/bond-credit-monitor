name: Publish registered events

on:
  push:
    branches: [main]
    paths: [registered_events.json]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge registered events into the page
        run: python3 publish_registered.py

      - name: Commit the merged page back
        run: |
          if git diff --quiet -- github_pages/index.html; then
            echo "page unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add github_pages/index.html
            git commit -m "Merge registered events into the events page"
            git push
          fi

      - name: Push the page to the serving repo
        env:
          TOKEN: ${{ secrets.SERVING_PUSH_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/lazybuttrying/lazybuttrying.github.io.git" serving
          cp github_pages/index.html serving/bond-credit-monitor/index.html
          cd serving
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bond-credit-monitor/index.html
          if git diff --cached --quiet; then
            echo "serving page unchanged, nothing to publish"
          else
            git commit -m "Publish registered events from bond-credit-monitor"
            git push
          fi
